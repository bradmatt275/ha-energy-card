name: Release

on:
  push:
    branches:
      - main
  # Manual run from the Actions tab. On main this makes a normal release;
  # on any other branch it makes a pre-release (e.g. v1.0.10-beta.42) that
  # HACS can install with "Show beta versions" enabled.
  workflow_dispatch:

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: energy-flow-card-${{ github.ref_name == 'main' && 'main' || github.run_number }}
          path: dist/energy-flow-card.js

      - name: Determine release type
        id: type
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "Pre-release build from branch ${GITHUB_REF_NAME}"
          fi

      - name: Get latest version and calculate next
        id: version
        run: |
          # Hardcoded major version - change this manually when needed
          MAJOR=1

          # Latest *stable* tag for this major version (ignore -beta.N pre-releases)
          LATEST_TAG=$(git tag -l "v${MAJOR}.*" --sort=-v:refname | grep -E "^v${MAJOR}\.[0-9]+\.[0-9]+$" | head -n1 || true)

          if [ -z "$LATEST_TAG" ]; then
            # No tags yet for this major version, start at x.0.0
            MINOR=0
            PATCH=0
          else
            # Extract minor and patch from latest tag (e.g., v1.2.3 -> 2, 3)
            VERSION_PART=${LATEST_TAG#v${MAJOR}.}
            MINOR=$(echo $VERSION_PART | cut -d. -f1)
            PATCH=$(echo $VERSION_PART | cut -d. -f2)

            # Increment patch version
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          if [ "${{ steps.type.outputs.prerelease }}" = "true" ]; then
            # Unique per run, sorts before the stable release it leads up to
            NEW_VERSION="${NEW_VERSION}-beta.${GITHUB_RUN_NUMBER}"
          fi

          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Check if release needed
        id: check
        run: |
          # Pre-releases are always built on request
          if [ "${{ steps.type.outputs.prerelease }}" = "true" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Skip if the current commit already has a *stable* tag
          # (a beta tag on the same commit must not block the real release)
          if git tag --points-at HEAD | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "Current commit already tagged, skipping release"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes
        if: steps.check.outputs.skip != 'true'
        id: notes
        run: |
          # Previous stable tag (pre-releases excluded)
          PREV_TAG=$(git tag -l "v*" --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)

          if [ -z "$PREV_TAG" ]; then
            NOTES="Initial release of Energy Flow Card for Home Assistant"
          else
            # Generate changelog from commits since last tag
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges | head -20)
          fi

          if [ "${{ steps.type.outputs.prerelease }}" = "true" ]; then
            NOTES="> ⚠️ Pre-release built from branch \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}) for testing.

          ${NOTES}"
          fi

          # Use EOF delimiter to handle multiline output properly
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## Changes
            ${{ steps.notes.outputs.notes }}

            ## Installation

            ### HACS (Recommended)
            1. Add this repository as a custom repository in HACS
            2. Install "Energy Flow Card"
            3. Refresh your browser

            ### Manual
            1. Download `energy-flow-card.js` below
            2. Copy to `config/www/energy-flow-card.js`
            3. Add resource in Lovelace: `/local/energy-flow-card.js`
          draft: false
          prerelease: ${{ steps.type.outputs.prerelease }}
          files: |
            dist/energy-flow-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
